version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Istanbul
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']

  # The npm ecosystem also covers pnpm workspaces (reads pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Istanbul
    # Wait a week after a release before proposing it (same idea as pnpm's minimum release age).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
