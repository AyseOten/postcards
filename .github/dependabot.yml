version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Istanbul
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']

  # The npm ecosystem also covers pnpm workspaces (reads pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Istanbul
    # Wait a week after a release before proposing it (same idea as pnpm's minimum release age).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Hold ESLint at 9.x: eslint-config-next depends on eslint-plugin-react, whose peer range
      # stops at ESLint ^9.7, so ESLint 10 is not supported yet (see docs/decisions/0001).
      # @eslint/js is versioned together with eslint.
      # Remove this rule once eslint-config-next (and eslint-plugin-react) support ESLint 10,
      # then update eslint and @eslint/js together and revisit ADR 0001.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
